  name: JSON Schema (via OpenAPI 3.0 Schema Object and MCP inputSchema)
  conforms: partial
  evidence:
    detail: "MCP tool inputSchemas are well-formed JSON Schema. The OpenAPI request bodies are structurally valid but semantically thin - every property is `type: string` with no description, enum, default or example, even where the docs publish enums (e.g. amazon marketplace has 19 allowed values in docs, none in the spec). Response `data` is entirely untyped."
