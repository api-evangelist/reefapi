domain_standard:
  applicable: false
  market: web data extraction / SERP and marketplace data aggregation
  detail: >-
    REWARD-ONLY CHECK, CORRECTLY EMPTY. The web-data-extraction market has no
    interoperability standard - there is no schema body, no shared message type and no
    conformance profile that a scraping/aggregation gateway can declare. Competitors
    named on the provider's own comparison pages (Bright Data, Oxylabs, Zyte, SerpAPI,
    ScraperAPI, ScrapingBee, ZenRows, Firecrawl, Apify, Diffbot, DataForSEO, Octoparse,
    ParseHub) each publish a bespoke contract for the same reason. The contract was
    searched for SCIM URNs, OData $metadata, OpenRTB, Sparkplug, ActivityPub, LTI /
    OneRoster / Ed-Fi / Caliper / QTI, OAI-PMH verbs, ORCID / DataCite / Crossref
    identifier schemes and HL7v2 / X12 / EDIFACT / ISO 20022 message types - none
    present, and none would be appropriate. Nothing invented to fill the slot.
  adjacent_note: >-
    Two engines DO touch standards-bearing domains without claiming conformance -
    `academic` proxies OpenAlex, arXiv and Crossref (and exposes author_id / venue_id /
    institution_id / concept_id filters that are OpenAlex entity identifiers), and
    `hs-code` works in WCO Harmonized System tariff codes. These are pass-through
    vocabularies of the upstream source, not a conformance ReefAPI declares in its own
    contract, so they are recorded here rather than as a domain_standard claim.
