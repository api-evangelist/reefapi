name: ReefAPI
slug: reefapi
summary: >-
  ReefAPI conforms to the discovery and agent-transport standards (OpenAPI 3.0.3,
  RFC 9727 API catalog, MCP 2025-06-18, llms.txt) and to none of the HTTP semantic
  standards (no RFC 9457 problem+json, no RFC 9331 rate-limit headers, no RFC 8594
  Sunset, no OAuth). That split is characteristic of an agent-first, RPC-over-POST
  gateway - the machine-discovery layer is unusually complete while the HTTP layer is
  deliberately minimal.
