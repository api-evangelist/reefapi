  detail: >-
    Provider-hosted, not Statuspage/Instatus. The page states it is driven by an
    internal canary running real capability checks against each live upstream every
    cycle, and that it shows only confirmed customer-impacting outages rather than
    transient noise. A JSON twin at https://api.reefapi.com/status makes it agent-readable,
    which is rarer than the status page itself.
  observation_2026_08_31: >-
    The JSON endpoint returned all-zero counters and an empty engines[] array
    (summary.total 0), and the HTML page rendered "All monitored systems operational ·
    0 monitored". Recorded as observed - the surface is live and machine-readable, but
    on this probe it published no per-engine rows, so a consumer cannot currently see
    which of the 183 engines is being watched.
