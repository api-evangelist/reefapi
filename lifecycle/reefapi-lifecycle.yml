  gap: >-
    An engine is a wrapper around a third-party site, so engines can and will be
    retired when a source dies — the DISABLED (503) error code exists precisely for
    "endpoint temporarily turned off". There is no published policy for how that is
    announced or how long a retiring engine is kept alive.
