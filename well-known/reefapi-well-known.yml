  pointing at the OpenAPI service-desc, the human service-doc and a machine-readable
  status endpoint. Every other named well-known path 404s on both hosts. The marketing
  host reefapi.com answers all /.well-known/* with its Next.js 404 HTML page (status 404,
  not a soft-200), so there are no false positives there.
