name: ReefAPI
description: >-
  A unified web-data platform that fronts a catalog of ~183 live web-data 'engines' behind one JSON contract, one API
  key, and one credit pool. Every call is POST https://api.reefapi.com/<api>/v1/<action> returning a uniform
  {ok,data,meta,error} envelope. Includes a hosted MCP server for agent-native access.
