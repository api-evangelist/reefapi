openapi: 3.2.0
info:
  title: Reef Social Media API
  version: 1.0.0
  description: Unified data-API gateway. Call POST /{engine}/v1/{action} with an x-api-key header; every response is the { ok, data, meta, error } envelope.
servers:
- url: https://api.reefapi.com
security:
- ApiKeyAuth: []
tags:
- name: Social Media
paths:
  /bluesky/v1/profile:
    post:
      operationId: bluesky_profile
      summary: 'actor profile: did/handle/displayName/desc/followers/follows/posts…'
      tags:
      - Social Media
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actor:
                  type: string
                actors:
                  type: string
            example:
              actor: bsky.app
      responses:
        '200':
          description: Result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Missing or invalid x-api-key
        '429':
          description: Rate limited or quota exhausted
  /bluesky/v1/author_feed:
    post:
      operationId: bluesky_author_feed
      summary: an actor's posts (full record+embed+counts), cursor-paginated…
      tags:
      - Social Media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor:
                  type: string
                limit:
                  type: string
                filter:
                  type: string
                cursor:
                  type: string
