openapi: 3.2.0
info:
  title: Reef Other API
  version: 1.0.0
  description: Unified data-API gateway. Call POST /{engine}/v1/{action} with an x-api-key header; every response is the { ok, data, meta, error } envelope.
servers:
- url: https://api.reefapi.com
security:
- ApiKeyAuth: []
tags:
- name: Other
paths:
  /alibaba/v1/search:
    post:
      operationId: alibaba_search
      summary: Search alibaba.com wholesale listings by keyword — 48 supplier offers per page…
      tags:
      - Other
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                page:
                  type: string
                sort:
                  type: string
                min_price:
                  type: string
                max_price:
                  type: string
                min_order:
                  type: string
                max_order:
                  type: string
                supplier_country:
                  type: string
                category_id:
                  type: string
                verified_supplier:
                  type: string
                trade_assurance:
                  type: string
                min_review_score:
                  type: string
              required:
              - query
            example:
              query: led strip
      responses:
        '200':
          description: Result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Missing or invalid x-api-key
        '429':
          description: Rate limited or quota exhausted
  /alibaba/v1/product_detail:
    post:
      operationId: alibaba_product_detail
      summary: Full wholesale detail for one alibaba.com listing — the complete quantity price…
      tags:
      - Other
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: string
                url:
                  type: string
            example:
              product_id: '1600104532932'
      responses:
        '200':
          description: Result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Missing or invalid x-api-key
        '429':
          description: Rate limited or quota exhausted
  /alibaba/v1/rfq_search:
