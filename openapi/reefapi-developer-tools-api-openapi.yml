  /dev-utils/v1/regex_test:
    post:
      operationId: dev_utils_regex_test
      summary: 'Test a regex against text: matches + groups + named groups, optional replace.'
      tags:
      - Developer Tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pattern:
                  type: string
                input:
                  type: string
                flags:
                  type: string
                replacement:
                  type: string
                max_matches:
                  type: string
              required:
              - pattern
              - input
            example:
              pattern: (\w+)@([\w.]+)
              input: mail jane@acme.com now
      responses:
        '200':
          description: Result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Missing or invalid x-api-key
        '429':
          description: Rate limited or quota exhausted
  /dev-utils/v1/format:
    post:
      operationId: dev_utils_format
      summary: Pretty-print, minify or validate JSON / YAML / XML / SQL (string-level…
      tags:
      - Developer Tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                type:
                  type: string
                op:
                  type: string
                indent:
                  type: string
                sort_keys:
                  type: string
                keyword_case:
                  type: string
              required:
              - input
              - type
            example:
              input: '{"b":1,"a":[1,2]}'
              type: json
              op: pretty
              sort_keys: true
      responses:
        '200':
          description: Result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
