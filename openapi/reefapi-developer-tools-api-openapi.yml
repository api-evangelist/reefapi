        '429':
          description: Rate limited or quota exhausted
  /dev-utils/v1/convert:
    post:
      operationId: dev_utils_convert
      summary: Convert structured data between JSON / YAML / CSV / XML at the string level…
      tags:
      - Developer Tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                from:
                  type: string
                to:
                  type: string
                indent:
                  type: string
                sort_keys:
                  type: string
              required:
              - input
              - from
              - to
            example:
              input: '[{"id":1,"name":"a"},{"id":2,"name":"b"}]'
              from: json
              to: csv
      responses:
        '200':
          description: Result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Missing or invalid x-api-key
        '429':
          description: Rate limited or quota exhausted
  /dev-utils/v1/qr:
    post:
      operationId: dev_utils_qr
      summary: Generate a QR code as SVG (text), base64-PNG (text data-URI), or terminal ASCII…
      tags:
      - Developer Tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
                kind:
                  type: string
                error_correction:
                  type: string
                scale:
                  type: string
                border:
                  type: string
              required:
