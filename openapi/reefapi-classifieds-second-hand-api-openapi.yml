openapi: 3.2.0
info:
  title: Reef Classifieds & Second-hand API
  version: 1.0.0
  description: Unified data-API gateway. Call POST /{engine}/v1/{action} with an x-api-key header; every response is the { ok, data, meta, error } envelope.
servers:
- url: https://api.reefapi.com
security:
- ApiKeyAuth: []
tags:
- name: Classifieds & Second-hand
paths:
  /autoscout24/v1/search:
    post:
      operationId: autoscout24_search
      summary: Paginated car search by make (+ model/filters) across EU TLDs; deal signals…
      tags:
      - Classifieds & Second-hand
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                make:
                  type: string
                model:
                  type: string
                model_group:
                  type: string
                country:
                  type: string
                page:
                  type: string
                sort:
                  type: string
                desc:
                  type: string
                price_min:
                  type: string
                price_max:
                  type: string
                year_min:
                  type: string
                year_max:
                  type: string
                mileage_min:
                  type: string
                mileage_max:
                  type: string
                fuel:
                  type: string
                transmission:
                  type: string
                body_type:
                  type: string
                zip:
                  type: string
                radius:
                  type: string
                power_min:
                  type: string
                power_max:
                  type: string
                super_deal:
                  type: string
                seller_type:
                  type: string
                offer_type:
                  type: string
            example:
              make: bmw
              country: de
      responses:
        '200':
          description: Result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Missing or invalid x-api-key
        '429':
          description: Rate limited or quota exhausted
  /autoscout24/v1/listing:
    post:
      operationId: autoscout24_listing
      summary: Full listing detail by url/path or id (description, prices, vehicle, images…
      tags:
      - Classifieds & Second-hand
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                path:
                  type: string
