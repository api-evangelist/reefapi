openapi: 3.2.0
info:
  title: Reef Media, Film & Knowledge API
  version: 1.0.0
  description: Unified data-API gateway. Call POST /{engine}/v1/{action} with an x-api-key header; every response is the { ok, data, meta, error } envelope.
servers:
- url: https://api.reefapi.com
security:
- ApiKeyAuth: []
tags:
- name: Media, Film & Knowledge
paths:
  /academic/v1/search:
    post:
      operationId: academic_search
      summary: search papers (source=openalex|arxiv|crossref|all; cursor pagination…
      tags:
      - Media, Film & Knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                source:
                  type: string
                per_page:
                  type: string
                cursor:
                  type: string
                filter:
                  type: string
                sort:
                  type: string
                from_year:
                  type: string
                to_year:
                  type: string
                open_access:
                  type: string
                type:
                  type: string
                match:
                  type: string
                category:
                  type: string
                include_abstract:
                  type: string
                fulltext:
                  type: string
                author_id:
                  type: string
                venue_id:
                  type: string
                institution_id:
                  type: string
                concept_id:
                  type: string
                topic_id:
                  type: string
              required:
              - query
            example:
              query: covid
      responses:
        '200':
          description: Result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Missing or invalid x-api-key
        '429':
          description: Rate limited or quota exhausted
  /academic/v1/paper_detail:
    post:
      operationId: academic_paper_detail
      summary: full paper (abstract/authors/affiliations/venue/year/DOI/OA-PDF/fields)…
      tags:
