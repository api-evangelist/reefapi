openapi: 3.2.0
info:
  title: Reef E-commerce & Marketplaces API
  version: 1.0.0
  description: Unified data-API gateway. Call POST /{engine}/v1/{action} with an x-api-key header; every response is the { ok, data, meta, error } envelope.
servers:
- url: https://api.reefapi.com
security:
- ApiKeyAuth: []
tags:
- name: E-commerce & Marketplaces
paths:
  /aliexpress/v1/search:
    post:
      operationId: aliexpress_search
      summary: Product search cards (price, sold_count, rating, store); filters…
      tags:
      - E-commerce & Marketplaces
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                country:
                  type: string
                currency:
                  type: string
                page:
                  type: string
                max_pages:
                  type: string
                max_results:
                  type: string
                sort:
                  type: string
                min_price:
                  type: string
                max_price:
                  type: string
                ship_from:
                  type: string
                free_shipping:
                  type: string
            example:
              query: wireless earbuds
              country: US
              currency: USD
      responses:
        '200':
          description: Result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Missing or invalid x-api-key
        '429':
          description: Rate limited or quota exhausted
  /aliexpress/v1/product_detail:
