openapi: 3.2.0
info:
  title: Reef Travel & Lodging API
  version: 1.0.0
  description: Unified data-API gateway. Call POST /{engine}/v1/{action} with an x-api-key header; every response is the { ok, data, meta, error } envelope.
servers:
- url: https://api.reefapi.com
security:
- ApiKeyAuth: []
tags:
- name: Travel & Lodging
paths:
  /agoda/v1/destinations:
    post:
      operationId: agoda_destinations
      summary: Resolve a free-text place ('Bangkok', 'Tokyo', 'Maldives', an airport or a…
      tags:
      - Travel & Lodging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                language:
                  type: string
              required:
              - query
            example:
              query: Bangkok
      responses:
        '200':
          description: Result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Missing or invalid x-api-key
        '429':
          description: Rate limited or quota exhausted
  /agoda/v1/city_browse:
    post:
      operationId: agoda_city_browse
      summary: Browse a city's popular hotels and accommodation themes.
      tags:
      - Travel & Lodging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                city_id:
                  type: string
                language:
                  type: string
              required:
              - city_id
            example:
              city_id: 9395
      responses:
        '200':
          description: Result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Missing or invalid x-api-key
        '429':
          description: Rate limited or quota exhausted
  /agoda/v1/detail:
    post:
      operationId: agoda_detail
      summary: 'Full hotel record by hotel_id (or hotel URL): name, accommodation type, star…'
      tags:
      - Travel & Lodging
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hotel_id:
                  type: string
                url:
                  type: string
                language:
                  type: string
            example:
              hotel_id: 294217
      responses:
        '200':
          description: Result envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          description: Missing or invalid x-api-key
        '429':
          description: Rate limited or quota exhausted
  /agoda/v1/reviews:
    post:
      operationId: agoda_reviews
      summary: 'Paginated guest reviews for one hotel (70 per page): star rating, title…'
      tags:
      - Travel & Lodging
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
