      - Travel & Lodging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                checkin:
                  type: string
                checkout:
                  type: string
                adults:
                  type: string
                children:
                  type: string
                infants:
                  type: string
                price_min:
                  type: string
                price_max:
                  type: string
                room_type:
                  type: string
                property_type:
                  type: string
                min_bedrooms:
                  type: string
                min_beds:
                  type: string
                min_bathrooms:
                  type: string
                amenities:
                  type: string
                host_languages:
                  type: string
                instant_book:
                  type: string
                superhost:
                  type: string
                free_cancellation:
                  type: string
                pets_allowed:
                  type: string
                cursor:
                  type: string
                currency:
                  type: string
                locale:
                  type: string
              required:
              - query
            example:
              query: Istanbul, Turkey
              checkin: '2026-09-21'
              checkout: '2026-09-26'
              adults: 2
      responses:
        '200':
          description: Result envelope
          content:
            application/json:
              schema:
