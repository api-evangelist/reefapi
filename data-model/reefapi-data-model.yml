payload_documentation:
  machine_readable: false
  human_readable: true
  agent_readable: true
  detail: >-
    The response record shapes ARE documented, just not in the spec. Each engine
    publishes a markdown twin at https://reefapi.com/docs/{engine}.md that names every
    returned field in a prose "Returns:" line (verified on amazon.md - product{asin,
    title, price, currency, rating, brand, features[], images[], variations, tech_specs,
    aplus, compare_similar[], coupon, campaign, gtin, upc, ean, isbn, barcodes[]} plus
    reviews[]{...} plus review_insights{...}). The MCP get_action_schema tool returns
    the same information structured. So an agent CAN learn the payload; a code generator
    reading only the OpenAPI cannot.
id_prefixes:
  present: false
  note: >-
    No ReefAPI-issued object identifiers exist - the gateway returns the upstream
    source's own identifiers (Amazon ASIN, Zillow zpid, Reddit id, OpenAlex entity ids).
    The one ReefAPI-issued identifier observed is the API key prefix ak_live_.
gaps:
- "components.schemas holds ONE schema for 1,528 operations. Response payloads are untyped, so no client can be generated with meaningful return types."
- "Request properties are all `type: string` with no description, enum, default or example, even where the docs publish 19-value enums."
- "The `Other` tag is applied to 57 operations but not declared in tags[]."
- "The gateway's own catalog (engines, actions, categories, credit prices) is served over MCP and markdown but has no REST endpoint and no schema."
