name: ReefAPI
slug: reefapi
summary: >-
  ReefAPI's data model is deliberately two-layer and only the OUTER layer is typed. The
  outer layer is a single reusable envelope shared by all 1,528 operations; the inner
  layer - the actual records (products, listings, reviews, jobs, papers) - is declared
  as an untyped `data` property and lives instead in per-engine prose. The entity graph
  below is therefore the GATEWAY model (Engine -> Action -> Envelope), not a business
  entity graph, because the provider does not publish one in machine-readable form.
schema_count_in_spec: 1
entities:
- name: Envelope
  kind: schema
  spec_ref: '#/components/schemas/Envelope'
  required: [ok]
  properties:
  - name: ok
    type: boolean
    role: discriminator
  - name: data
    type: any
    role: payload
    note: "Declared with a description only - \"Action result (shape varies per action)\" - and no type, no properties and no oneOf. This is the single largest contract gap."
  - name: meta
    type: object
    role: telemetry
    documented_fields: [api, endpoint, mode, latency_ms, record_count, completeness_pct, bytes, cache_hit, credits]
    note: Described in prose on the schema; the individual fields are not declared as properties.
  - name: error
    type: object
    nullable: true
    role: failure
    properties: [code, message, retryable]
  reuse: 1528 operations reference this one schema
